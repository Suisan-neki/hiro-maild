[workspace]
members = ["crates/mail-core"]
resolver = "2"

[package]
name = "hiro-maild"
version = "0.1.0"
edition = "2024"
description = "Read-only Hiroshima University mail ingestion and Gmail forwarding with a web UI"
license = "MIT"

[dependencies]
hiro-mail-core = { path = "crates/mail-core" }
anyhow = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
fs2 = "0.4"
getrandom = "0.4"
axum = "0.8"
clap = { version = "4.6", features = ["derive", "env"] }
mail-parser = { version = "0.11.8", features = ["full_encoding"] }
pdf-extract = "0.12"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "rustls", "webpki-roots"] }
rmcp = { version = "3.2.0", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tokio-util = "0.7"
time = { version = "0.3", features = ["formatting", "parsing"] }
walkdir = "2.5"
tempfile = "3"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
