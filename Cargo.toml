[package]
name = "hiro-maild"
version = "0.1.0"
edition = "2024"
description = "Read-only university mail ingestion and triage for Hiroshima University mail via Thunderbird local sync"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
mail-parser = { version = "0.11.8", features = ["full_encoding"] }
pdf-extract = "0.12"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "webpki-roots"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
walkdir = "2.5"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
